[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "meeple-bots"
version = "0.1.0"
description = "Modular framework for simulating board games with intelligent agents"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
meeple-bots = "meeple_bots.cli:main"

[tool.maturin]
bindings = "pyo3"
manifest-path = "crates/python-bindings/Cargo.toml"
module-name = "meeple_bots._native"
python-source = "python/src"
