# Copy this file to create a reproducible MCTS profile.
name = "example-mcts"
iterations = 500
# Use `time_budget = 1.0` instead of `iterations` for an approximate one-second decision budget.
rollout_depth = 16
exploration = 1.4142135623730951
cutoff_evaluator = { kind = "neutral" }
rollout_policy = { kind = "uniform_random" }

# Informed-rollout example, independent from cutoff evaluation:
# rollout_policy = { kind = "epsilon_greedy", epsilon = 0.1, evaluator = { kind = "game_heuristic", index = 0 } }

# SPOTF phase-scoped example: informed during Collect, uniform during gemstone placement:
# rollout_policy = { kind = "conditional", condition = { kind = "turn_phase", phase = "collect" }, primary = { kind = "epsilon_greedy", epsilon = 0.25, evaluator = { kind = "game_heuristic", index = 2 } }, fallback = { kind = "uniform_random" } }

# Legacy profiles using use_heuristic/heuristic_index and flat rollout fields remain supported.
