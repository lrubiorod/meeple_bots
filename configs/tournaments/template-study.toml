# Executable SPOTF tournament template demonstrating the supported agent configurations.
# It expands to 22 agents, 231 cross-agent pairings, and one selected self-play pairing.
# With two matches per pairing this produces 464 matches. Increase the budgets only after
# checking the expected runtime with `meeple-bots analyze`.
game = "spotf"
output = "../../results/tournaments/template-study.jsonl"
matches_per_pair = 2
seed = 42
max_plies = 10000
workers = "auto"

# A non-search baseline. Random agents do not accept any MCTS-only fields.
[[agents]]
name = "random"
kind = "random"

# Original MCTS baseline: uniform-random rollouts and neutral cutoff evaluation. This agent and
# mcts-rollout-h0 use the same wall-clock budget so their different per-iteration costs are fair.
# Omitted rollout_policy defaults to `uniform_random`.
[[agents]]
name = "mcts-uniform"
kind = "mcts"
time_budget = 0.05
rollout_depth = 32
exploration = 1.4142135623730951
use_heuristic = false
self_play = true

# Uniform-random rollout with heuristic 1 used only when the rollout reaches its depth cutoff.
# Because the rollout policy is uniform, the heuristic does not influence intermediate actions.
[[agents]]
name = "mcts-cutoff-h1"
kind = "mcts"
iterations = 250
rollout_depth = 32
exploration = 1.4142135623730951
cutoff_evaluator = { kind = "game_heuristic", index = 1 }
rollout_policy = { kind = "uniform_random" }

# Informed rollout only: cutoff states are neutral, while heuristic 0 selects rollout actions.
# With epsilon 0.10, approximately 10% are random and 90% choose a best-rated successor.
[[agents]]
name = "mcts-rollout-h0"
kind = "mcts"
time_budget = 0.05
rollout_depth = 32
exploration = 1.4142135623730951
cutoff_evaluator = { kind = "neutral" }
rollout_policy = { kind = "epsilon_greedy", epsilon = 0.10, evaluator = { kind = "game_heuristic", index = 0 } }

# Both mechanisms enabled with independent configuration. Cutoff uses H0 while rollout uses the
# reachable-progress H2 evaluator.
[[agents]]
name = "mcts-cutoff-h0-rollout-h2"
kind = "mcts"
iterations = 250
rollout_depth = 32
exploration = 1.4142135623730951
cutoff_evaluator = { kind = "game_heuristic", index = 0 }
rollout_policy = { kind = "greedy", evaluator = { kind = "game_heuristic", index = 2 } }

# Epsilon sweep using heuristic 1 only for informed action selection.
# The array creates four agents named with -e0.0, -e0.1, -e0.25, and -e1.0 suffixes:
#   epsilon 0.0  -> fully greedy rollout;
#   epsilon 0.1  -> 90% greedy, 10% random;
#   epsilon 0.25 -> 75% greedy, 25% random;
#   epsilon 1.0  -> fully random rollout (the evaluator is not consulted for selection).
[[agents]]
name = "mcts-epsilon-h1"
kind = "mcts"
iterations = 250
rollout_depth = 32
exploration = 1.4142135623730951
cutoff_evaluator = { kind = "neutral" }
rollout_policy = { kind = "epsilon_greedy", epsilon = [0.0, 0.1, 0.25, 1.0], evaluator = { kind = "game_heuristic", index = 1 } }

# Conditional informed rollout: H2 guides Collect decisions, while gemstone decisions remain
# uniform random. The nested epsilon array is expanded exactly like a top-level policy grid.
[[agents]]
name = "mcts-collect-rollout-h2"
kind = "mcts"
iterations = 250
rollout_depth = 32
exploration = 1.4142135623730951
cutoff_evaluator = { kind = "game_heuristic", index = 2 }
rollout_policy = { kind = "conditional", condition = { kind = "turn_phase", phase = "collect" }, primary = { kind = "epsilon_greedy", epsilon = [0.0, 0.25, 0.5, 0.75], evaluator = { kind = "game_heuristic", index = 2 } }, fallback = { kind = "uniform_random" } }

# Progressive Bias keeps uniform rollouts but adds a cached, decaying H2 prior to UCT selection
# only for Collect decisions. The weight array expands to five agents with -pb... suffixes.
[[agents]]
name = "mcts-collect-progressive-h2"
kind = "mcts"
time_budget = 0.05
rollout_depth = 130
exploration = 1.4142135623730951
cutoff_evaluator = { kind = "game_heuristic", index = 2 }
rollout_policy = { kind = "uniform_random" }
progressive_bias = { weight = [0.0, 0.1, 0.25, 0.5, 1.0], evaluator = { kind = "game_heuristic", index = 2 }, condition = { kind = "turn_phase", phase = "collect" } }
root_diagnostics = true

# Cartesian-product example for comparing search width and horizon. These two arrays create four
# uniform-rollout agents: every combination of 100/500 iterations and depth 16/64.
[[agents]]
name = "mcts-width-depth-grid"
kind = "mcts"
iterations = [100, 500]
rollout_depth = [16, 64]
exploration = 1.4142135623730951
use_heuristic = false
rollout_policy = "uniform_random"
