# Round-robin study comparing full-depth and short informed-rollout MCTS configurations at the
# same 0.5-second wall-clock budget per decision. It expands to 8 agents and 28 pairings. With
# 20 matches per pairing, it runs 560 matches.
game = "spotf"
output = "../../results/tournaments/spotf-study-5.jsonl"
matches_per_pair = 20
seed = 42
max_plies = 500000
workers = "auto"

# Full-depth baseline with uniform-random rollouts and neutral cutoff evaluation.
[[agents]]
name = "mcts-full-random"
kind = "mcts"
time_budget = 0.5
rollout_depth = 130
exploration = 1.4142135623730951
cutoff_evaluator = { kind = "neutral" }
rollout_policy = { kind = "uniform_random" }

# Full-depth informed rollout using reachable-progress H2, with neutral cutoff evaluation.
[[agents]]
name = "mcts-full-epsilon-h2"
kind = "mcts"
time_budget = 0.5
rollout_depth = 130
exploration = 1.4142135623730951
cutoff_evaluator = { kind = "neutral" }
rollout_policy = { kind = "epsilon_greedy", epsilon = 0.1, evaluator = { kind = "game_heuristic", index = 2 } }

# Short uniform-random rollouts. The grid compares H1/H2 cutoff at the shared time budget.
[[agents]]
name = "mcts-short-random"
kind = "mcts"
time_budget = 0.5
rollout_depth = 32
exploration = 1.4142135623730951
cutoff_evaluator = { kind = "game_heuristic", index = [1, 2] }
rollout_policy = { kind = "uniform_random" }

# Short epsilon-greedy rollouts evaluated with H1. Cutoff independently varies between H1/H2.
[[agents]]
name = "mcts-short-epsilon-h1"
kind = "mcts"
time_budget = 0.5
rollout_depth = 32
exploration = 1.4142135623730951
cutoff_evaluator = { kind = "game_heuristic", index = [1, 2] }
rollout_policy = { kind = "epsilon_greedy", epsilon = 0.1, evaluator = { kind = "game_heuristic", index = 1 } }

# Short epsilon-greedy rollouts evaluated with H2. Cutoff independently varies between H1/H2.
[[agents]]
name = "mcts-short-epsilon-h2"
kind = "mcts"
time_budget = 0.5
rollout_depth = 32
exploration = 1.4142135623730951
cutoff_evaluator = { kind = "game_heuristic", index = [1, 2] }
rollout_policy = { kind = "epsilon_greedy", epsilon = 0.1, evaluator = { kind = "game_heuristic", index = 2 } }
